<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập - Colab VPS Monitor</title>
<style>
  :root { --blue:#1565c0; --blue2:#1e88e5; --soft:#e3f2fd; --line:#d6e4f5; --text:#1b2a3a; --muted:#5f7390; --bad:#c62828; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f6faff; color:var(--text); font:15px/1.5 "Segoe UI",system-ui,sans-serif; }
  form { width:min(380px,92vw); background:#fff; border:1px solid var(--line); border-top:4px solid var(--blue2); border-radius:14px; padding:26px 24px; box-shadow:0 4px 18px rgba(21,101,192,.10); }
  h1 { margin:0 0 4px; font-size:20px; color:var(--blue); } p { margin:0 0 18px; color:var(--muted); font-size:13px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
  input:focus { outline:2px solid var(--soft); border-color:var(--blue2); }
  button { width:100%; margin-top:20px; padding:11px; border:0; border-radius:8px; background:var(--blue); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:hover { background:#0f4f99; }
  .err { margin-top:14px; padding:8px 10px; background:#ffebee; color:var(--bad); border-radius:8px; font-size:13px; }
</style>
</head>
<body>
<form method="post" action="/login" autocomplete="on">
  <h1>Colab VPS Monitor</h1>
  <p>Đăng nhập để xem và điều khiển phiên huấn luyện.</p>
  <label for="u">Tài khoản</label><input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">Mật khẩu</label><input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Đăng nhập</button>
  <!--ERR-->
</form>
</body>
</html>
