services:
  workstation:
    build:
      context: .
      dockerfile: Dockerfile
    image: se374-bcss-wsss-workstation:latest
    container_name: se374-wsss-workstation
    ports:
      - "8000:8000"
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./data:/app/data:ro
    environment:
      - WSSS_GATE7_DIR=/app/checkpoints/vps_evidence
      - MPLBACKEND=Agg
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); assert r.status == 200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
