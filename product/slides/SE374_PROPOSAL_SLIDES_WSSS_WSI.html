<h1 id="2-m%E1%BB%A5c-ti%C3%AAu-nghi%C3%AAn-c%E1%BB%A9u--%C4%91%C3%B3ng-g%C3%B3p-d%E1%BB%B1-ki%E1%BA%BFn">2. Mục Tiêu Nghiên Cứu &amp; Đóng Góp Dự Kiến</h1>
<h3 id="hai-tr%E1%BB%A5-c%E1%BB%99t-%C4%91%E1%BB%93-%C3%A1n-m%C3%B4n-se374-medical-ai--software-engineering">Hai Trụ Cột Đồ Án Môn SE374 (Medical AI + Software Engineering)</h3>
<div class="grid-2">
<div>
<h4 id="tr%E1%BB%A5-c%E1%BB%99t-1-nghi%C3%AAn-c%E1%BB%A9u-l%C3%B5i-ai-y-khoa">Trụ Cột 1: Nghiên Cứu Lõi AI Y Khoa</h4>
<ul>
<li><strong>Mô hình hóa WSSS:</strong> Khắc phục hiện tượng co ngót CAM, mở rộng ranh giới phân vùng đa lớp mô.</li>

<div>

<ul>
<li><strong>Web Workstation:</strong> Trình duyệt tiêu bản phân giải sâu OpenSeadragon (tốc độ <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.09ex;" xmlns="http://www.w3.org/2000/svg" width="4.651ex" height="1.622ex" role="img" focusable="false" viewBox="0 -677 2055.8 717"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="3E" d="M84 520Q84 528 88 533T96 539L99 540Q106 540 253 471T544 334L687 265Q694 260 694 250T687 235Q685 233 395 96L107 -40H101Q83 -38 83 -20Q83 -19 83 -17Q82 -10 98 -1Q117 9 248 71Q326 108 378 132L626 250L378 368Q90 504 86 509Q84 513 84 520Z"></path></g><g data-mml-node="mn" transform="translate(1055.8,0)"><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z"></path><path data-c="35" d="M164 157Q164 133 148 117T109 101H102Q148 22 224 22Q294 22 326 82Q345 115 345 210Q345 313 318 349Q292 382 260 382H254Q176 382 136 314Q132 307 129 306T114 304Q97 304 95 310Q93 314 93 485V614Q93 664 98 664Q100 666 102 666Q103 666 123 658T178 642T253 634Q324 634 389 662Q397 666 402 666Q410 666 410 648V635Q328 538 205 538Q174 538 149 544L139 546V374Q158 388 169 396T205 412T256 420Q337 420 393 355T449 201Q449 109 385 44T229 -22Q148 -22 99 32T50 154Q50 178 61 192T84 210T107 214Q132 214 148 197T164 157Z" transform="translate(500,0)"></path></g></g></g></svg></mjx-container> FPS).</li>

<h1 id="4-ph%C6%B0%C6%A1ng-ph%C3%A1p-%C4%91%E1%BB%81-xu%E1%BA%A5t-m%C3%B4-h%C3%ACnh-ai-proto-mamba-wsss">4. Phương Pháp Đề Xuất: Mô Hình AI Proto-Mamba WSSS</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>[Ảnh WSI Gigapixel 100k x 100k] -&gt; [TIAToolbox Tissue Masking] -&gt; [Patches 224x224 (Overlap 50%)]
                                                                               │
                                                                               ▼
┌─────────────────────────────────────────────────────────────────────────────────────────────┐
│  GIAI ĐOẠN 1: BỘ PHÂN LOẠI ĐA NHÃN + CHÚ Ý DROPOUT LŨY TIẾN (PDA)                           │
│  • Khối Contrastive Mamba Block (CMB): Khai thác ngữ cảnh xa với độ phức tạp tuyến tính O(L)│
│  • Progressive Dropout Attention: β_t = μ_t * max(M_k) -&gt; Ép mạng mở rộng vùng kích hoạt     │
│  • Trích xuất Pseudo-Masks đa tầng: Lớp b4_3 (chi tiết) + b5_2 (cân bằng) + bn7 (ngữ nghĩa)  │
└─────────────────────────────────────────────────────────────────────────────────────────────┘
                                                                               │
                                                                               ▼
┌─────────────────────────────────────────────────────────────────────────────────────────────┐
│  GIAI ĐOẠN 2: MẠNG PHÂN VÙNG NGỮ NGHĨA + CỔNG PHÂN LOẠI (CGM)                              │
│  • Khớp nối Nguyên mẫu Trực quan (Prototype Matching): Đẩy lùi hiện tượng rò rỉ ranh giới   │
│  • Cổng Phân loại (CGM): Khi y_hat_k &lt;= 0.1 -&gt; Lập tức đóng kênh, triệt tiêu dương tính giả  │
│  • Overlap Stitching Engine: Ghép trung bình xác suất trên tọa độ slide toàn phần WSI        │
└─────────────────────────────────────────────────────────────────────────────────────────────┘
</code></pre>

<h1 id="5-ki%E1%BA%BFn-tr%C3%BAc-ph%E1%BA%A7n-m%E1%BB%81m-tr%E1%BA%A1m-l%C3%A0m-vi%E1%BB%87c-clean-architecture">5. Kiến Trúc Phần Mềm Trạm Làm Việc (Clean Architecture)</h1>
<div class="grid-2">
<div>
<h3 id="t%E1%BA%A7ng-1-client-web-tr%E1%BA%A1m-l%C3%A0m-vi%E1%BB%87c">Tầng 1: Client Web Trạm Làm Việc</h3>
<ul>
<li><strong>Giao diện hiện đại:</strong> HTML5, Canvas WebGL, Responsive CSS.</li>
<li><strong>DeepZoom Navigation:</strong> OpenSeadragon duyệt mức phóng đại <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="10.433ex" height="1.581ex" role="img" focusable="false" viewBox="0 -677 4611.6 699"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g><g data-mml-node="mo" transform="translate(500,0)"><path data-c="D7" d="M630 29Q630 9 609 9Q604 9 587 25T493 118L389 222L284 117Q178 13 175 11Q171 9 168 9Q160 9 154 15T147 29Q147 36 161 51T255 146L359 250L255 354Q174 435 161 449T147 471Q147 480 153 485T168 490Q173 490 175 489Q178 487 284 383L389 278L493 382Q570 459 587 475T609 491Q630 491 630 471Q630 464 620 453T522 355L418 250L522 145Q606 61 618 48T630 29Z"></path></g><g data-mml-node="mo" transform="translate(1555.8,0)"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g><g data-mml-node="mn" transform="translate(2833.6,0)"><path data-c="34" d="M462 0Q444 3 333 3Q217 3 199 0H190V46H221Q241 46 248 46T265 48T279 53T286 61Q287 63 287 115V165H28V211L179 442Q332 674 334 675Q336 677 355 677H373L379 671V211H471V165H379V114Q379 73 379 66T385 54Q393 47 442 46H471V0H462ZM293 211V545L74 212L183 211H293Z"></path><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -2 <li><strong>Bảng điều khiển lâm sàng:</strong> Biểu đồ diện tích, sTILs score (%), nút xuất báo cáo.</li>
</ul>
</div>
<div>
<h3 id="t%E1%BA%A7ng-2--3-medical-backend--engine">Tầng 2 &amp; 3: Medical Backend &amp; Engine</h3>
<ul>
<li><strong>FastAPI Tile Server:</strong> Cắt lát động DZI từ tệp SVS/NDPI với độ trễ <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.09ex;" xmlns="http://www.w3.org/2000/svg" width="4.651ex" height="1.597ex" role="img" focusable="false" viewBox="0 -666 2055.8 706"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="3C" d="M694 -11T694 -19T688 -33T678 -40Q671 -40 524 29T234 166L90 235Q83 240 83 250Q83 261 91 266Q664 540 678 540Q681 540 687 534T694 519T687 505Q686 504 417 376L151 250L417 124Q686 -4 687 -5Q694 -11 694 -19Z"></path></g><g data-mml-node="mn" transform="translate(1055.8,0)"><path data-c="35" d="M164 157Q164 133 148 117T109 101H102Q148 22 224 22Q294 22 326 82Q345 115 345 210Q345 313 318 349Q292 382 260 382H254Q176 382 136 314Q132 307 129 306T114 304Q97 304 95 310Q93 314 93 485V614Q93 664 98 664Q100 666 102 666Q103 666 123 658T178 642T253 634Q324 634 389 662Q397 666 402 666Q410 666 410 648V635Q328 538 205 538Q174 538 149 544L139 546V374Q158 388 169 396T205 412T256 420Q337 420 393 355T449 201Q449 109 385 44T229 -22Q148 -22 99 32T50 154Q50 178 61 192T84 210T107 214Q132 214 148 197T164 157Z"></path><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z" transform="translate(500,0)"></path></g></g></g></svg></mjx-container>ms.</li>

<li><strong>Report Engine:</strong> Xuất biên bản PDF hoàn chỉnh (chuẩn định dạng CAP).</li>
</ul>
</div>
</div>
<div class="highlight-box">
